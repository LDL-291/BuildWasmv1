name: Deploy Wasm to GCP

on:
  push:
    branches: [main]
    paths:
      - 'Build/**'
      - 'TemplateData/**'
      - 'index.html'
      - 'unity-responsive.js'
  workflow_dispatch:

jobs:
  deploy:
    name: Upload build to VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "Build/,TemplateData/,index.html,unity-responsive.js"
          target: /var/www/arghorithm/games/wasm/
          strip_components: 0

      - name: Smoke test
        run: |
          sleep 3
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 https://arghorithm.com/games/wasm/)
          [ "$STATUS" = "200" ] \
            && echo "Wasm OK (HTTP $STATUS)" \
            || (echo "Smoke test failed — HTTP $STATUS" && exit 1)
